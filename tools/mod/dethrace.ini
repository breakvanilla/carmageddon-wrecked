; Settings for Wrecked Carmageddon. Lines starting with ; are comments. Restart the game after a change.

[General]
; 3dfx-style OpenGL graphics: the mod's renderer needs this
Emulate3DFX=1
; 640x480 menus and HUD (scaled to the screen), not 320x200
Hires=1
; Physics every frame, not 25 times a second: smoother driving at high frame rates
PhysicsPerFrame=1
; Frame rate cap
FPSLimit=120
; 1 to play in a window
Windowed=0

[Cheats]
; 1 opens every race, car and upgrade from the start (upgrades still cost credits)
GameCompleted=0

[Environment]
; Each of these is the default. Remove the ; at the start of a line to change it.
; Strength of the lights from fires, explosions, sparks and police cars (0 turns them off)
;CARMA_LIGHTS=1
; Headlights at the start of a race: off, on, or auto (on for dark tracks only). N switches them in a race.
;CARMA_HEADLIGHTS=off
; How shiny car paint is (0 to 1)
;CARMA_REFLECTIONS=0.35
; How round cars are made (0 is the original flat polygons, up to 6)
;CARMA_TESSELLATION=6
; 0 keeps the 3D view 4:3 on a wide screen
;CARMA_WIDESCREEN=1
; 0 brings back the original car shadows
;CARMA_SHADOWS=1
; 0 leaves water as the original game had it
;CARMA_WATER=1
; Depth of rocket craters (0 leaves the road alone)
;CARMA_CRATERS=1
; Upscaling of menus and HUD: sharp, xbr (smooth curves) or nearest (plain square pixels)
;CARMA_HUD_FILTER=sharp
